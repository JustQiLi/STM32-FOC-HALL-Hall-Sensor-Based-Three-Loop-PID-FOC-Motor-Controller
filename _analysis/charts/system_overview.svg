<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1080" font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1480" height="1080" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="740" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">STM32F407 三轴串级 FOC 系统总框图（20kHz 中断每拍 50µs）</text>

  <!-- ========== 电流链区域 ========== -->
  <rect x="20" y="60" width="1440" height="175" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="35" y="85" font-size="15" font-weight="bold" fill="#1e40af">电流链（20kHz，每拍执行）</text>

  <!-- 电流链模块 -->
  <g font-size="12" text-anchor="middle">
    <rect x="35" y="100" width="110" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="122" font-weight="bold">三相电流</text>
    <text x="90" y="138">ADC 采样</text>

    <rect x="175" y="100" width="100" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="225" y="122" font-weight="bold">Clarke</text>
    <text x="225" y="138">三相→αβ</text>

    <rect x="305" y="100" width="100" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="355" y="122" font-weight="bold">Park</text>
    <text x="355" y="138">αβ→dq</text>

    <rect x="435" y="100" width="130" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="500" y="122" font-weight="bold">电流环 PI</text>
    <text x="500" y="138">零极点对消 300Hz</text>

    <rect x="595" y="100" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="650" y="122" font-weight="bold">死区补偿</text>
    <text x="650" y="138">用 Theta 投影</text>

    <rect x="735" y="100" width="100" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="785" y="122" font-weight="bold">反 Park</text>
    <text x="785" y="138">dq→αβ</text>

    <rect x="865" y="100" width="120" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="925" y="122" font-weight="bold">SVPWM</text>
    <text x="925" y="138">七段式/零序注入</text>

    <rect x="1015" y="100" width="110" height="50" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="1070" y="122" font-weight="bold">TIM8 CCR</text>
    <text x="1070" y="138">三相逆变器</text>

    <rect x="1155" y="100" width="100" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="1205" y="122" font-weight="bold">BLDC</text>
    <text x="1205" y="138">电机</text>
  </g>

  <!-- 电流链箭头 -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <line x1="145" y1="125" x2="173" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="275" y1="125" x2="303" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="405" y1="125" x2="433" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="565" y1="125" x2="593" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="705" y1="125" x2="733" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="835" y1="125" x2="863" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="985" y1="125" x2="1013" y2="125" marker-end="url(#arrowBlue)"/>
    <line x1="1125" y1="125" x2="1153" y2="125" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- Theta 使用标注 -->
  <g font-size="11" fill="#16a34a" text-anchor="middle">
    <text x="355" y="95">↑ 用 Theta</text>
    <text x="650" y="95">↑ 用 Theta</text>
    <text x="785" y="95">↑ 用 Theta</text>
  </g>

  <!-- ========== 角度获取链区域 ========== -->
  <rect x="20" y="255" width="1440" height="165" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="35" y="280" font-size="15" font-weight="bold" fill="#166534">角度获取链（每拍更新，所有 FOC 计算的基础）</text>

  <g font-size="12" text-anchor="middle">
    <rect x="35" y="295" width="110" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="90" y="317" font-weight="bold">三路霍尔</text>
    <text x="90" y="333">TIM5 输入捕获</text>

    <rect x="175" y="295" width="110" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="230" y="317" font-weight="bold">边沿解码</text>
    <text x="230" y="333">去抖 100µs</text>

    <rect x="315" y="295" width="140" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="385" y="317" font-weight="bold">s_hall_ang</text>
    <text x="385" y="333">扇区内插 + 60°钳位</text>

    <rect x="485" y="295" width="130" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="550" y="317" font-weight="bold">减零位 × 方向</text>
    <text x="550" y="333">上电标定 + 方向自检</text>

    <rect x="645" y="295" width="130" height="50" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="710" y="317" font-weight="bold">FOCParm.Theta</text>
    <text x="710" y="333">FOC 用电角度 [0,2π)</text>

    <rect x="805" y="295" width="110" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="860" y="317" font-weight="bold">÷ 极对数 4</text>
    <text x="860" y="333">电角度→机械角</text>

    <rect x="945" y="295" width="130" height="50" rx="6" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="1010" y="317" font-weight="bold">机械角</text>
    <text x="1010" y="333">连续多圈，不 wrap</text>
  </g>

  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="145" y1="320" x2="173" y2="320" marker-end="url(#arrowGreen)"/>
    <line x1="285" y1="320" x2="313" y2="320" marker-end="url(#arrowGreen)"/>
    <line x1="455" y1="320" x2="483" y2="320" marker-end="url(#arrowGreen)"/>
    <line x1="615" y1="320" x2="643" y2="320" marker-end="url(#arrowGreen)"/>
    <line x1="775" y1="320" x2="803" y2="320" marker-end="url(#arrowGreen)"/>
    <line x1="915" y1="320" x2="943" y2="320" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- Theta 到电流链的连线 -->
  <path d="M 710 295 L 710 200 L 355 152" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 710 295 L 710 200 L 650 152" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M 710 295 L 710 200 L 785 152" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 机械角分支 -->
  <g font-size="12" text-anchor="middle">
    <rect x="1120" y="295" width="140" height="50" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="1190" y="317" font-weight="bold">位置环反馈</text>
    <text x="1190" y="333">fmod 单圈归一化</text>

    <rect x="1290" y="295" width="140" height="50" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1360" y="317" font-weight="bold">PLL 观测器输入</text>
    <text x="1360" y="333">连续机械角</text>
  </g>
  <g stroke="#16a34a" stroke-width="2" fill="none">
    <line x1="1075" y1="310" x2="1118" y2="310" marker-end="url(#arrowGreen)"/>
    <line x1="1075" y1="330" x2="1288" y2="330" marker-end="url(#arrowGreen)"/>
  </g>

  <!-- 低速助推标注 -->
  <rect x="315" y="360" width="300" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="465" y="378" font-size="11" text-anchor="middle" fill="#991b1b">低速角度助推：修改 s_angle_spd → 间接影响 s_hall_ang → Theta（速度模式 &lt;25rpm）</text>
  <text x="465" y="393" font-size="11" text-anchor="middle" fill="#991b1b">丢边沿衰减：60rad/s² 线性衰减，不直接清零，防角度冻结自锁</text>

  <!-- ========== 速度环区域 ========== -->
  <rect x="20" y="440" width="1440" height="175" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="35" y="465" font-size="15" font-weight="bold" fill="#9a3412">速度环（1kHz，每 20 拍执行）</text>

  <g font-size="12" text-anchor="middle">
    <rect x="35" y="480" width="120" height="50" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="95" y="502" font-weight="bold">PLL 观测器</text>
    <text x="95" y="518">二阶锁相环</text>

    <rect x="185" y="480" width="100" height="50" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="235" y="502" font-weight="bold">转 rpm</text>
    <text x="235" y="518">rad/s→rpm</text>

    <rect x="315" y="480" width="110" height="50" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="370" y="502" font-weight="bold">±300rpm 钳位</text>
    <text x="370" y="518">只钳换相尖峰</text>

    <rect x="455" y="480" width="100" height="50" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="505" y="502" font-weight="bold">15Hz 低通</text>
    <text x="505" y="518">衰减台阶尖峰</text>

    <rect x="585" y="480" width="110" height="50" rx="6" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="640" y="502" font-weight="bold">速度环 PI</text>
    <text x="640" y="518">转速反馈输入</text>

    <rect x="725" y="480" width="120" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="785" y="502" font-weight="bold">摩擦前馈</text>
    <text x="785" y="518">REST→MOVING→BRAKE</text>

    <rect x="875" y="480" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="930" y="502" font-weight="bold">抗积分饱和</text>
    <text x="930" y="518">非对称三重钳制</text>

    <rect x="1015" y="480" width="100" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1065" y="502" font-weight="bold">转矩抬底</text>
    <text x="1065" y="518">堵转 0.5A</text>

    <rect x="1145" y="480" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1200" y="502" font-weight="bold">Iq 斜率限幅</text>
    <text x="1200" y="518">100A/s</text>

    <rect x="1285" y="480" width="110" height="50" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="1340" y="502" font-weight="bold">Iq 指令</text>
    <text x="1340" y="518">→ 电流环</text>
  </g>

  <g stroke="#ea580c" stroke-width="2" fill="none">
    <line x1="155" y1="505" x2="183" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="285" y1="505" x2="313" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="425" y1="505" x2="453" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="555" y1="505" x2="583" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="695" y1="505" x2="723" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="845" y1="505" x2="873" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="985" y1="505" x2="1013" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="1115" y1="505" x2="1143" y2="505" marker-end="url(#arrowOrange)"/>
    <line x1="1255" y1="505" x2="1283" y2="505" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- PLL 输入来自机械角 -->
  <path d="M 1360 295 L 1360 420 L 95 478" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="700" y="435" font-size="11" fill="#9a3412" text-anchor="middle">PLL 输入 = 机械角（来自角度链），PLL 不用于计算 FOC 电角度</text>

  <!-- Iq 指令到电流环 -->
  <path d="M 1340 480 L 1340 440 L 500 155" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowOrange)"/>

  <!-- 低速禁反向制动标注 -->
  <rect x="35" y="550" width="500" height="40" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="285" y="568" font-size="11" text-anchor="middle" fill="#991b1b">低速禁反向制动：200rpm 以下同向运行不输出反向 Iq，交给自然摩擦减速，防低速振荡</text>
  <text x="285" y="583" font-size="11" text-anchor="middle" fill="#991b1b">速度指令来自位置环输出（见下方位置环）</text>

  <!-- ========== 位置环区域 ========== -->
  <rect x="20" y="635" width="1440" height="155" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="35" y="660" font-size="15" font-weight="bold" fill="#5b21b6">位置环（200Hz，每 100 拍执行）</text>

  <g font-size="12" text-anchor="middle">
    <rect x="35" y="675" width="110" height="50" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="697" font-weight="bold">位置指令</text>
    <text x="90" y="713">0~360°</text>

    <rect x="175" y="675" width="130" height="50" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="240" y="697" font-weight="bold">单圈最短路径</text>
    <text x="240" y="713">fmod + ±180°误差</text>

    <rect x="335" y="675" width="110" height="50" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="390" y="697" font-weight="bold">位置环 PI</text>
    <text x="390" y="713">位置误差输入</text>

    <rect x="475" y="675" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="530" y="697" font-weight="bold">输出斜率限制</text>
    <text x="530" y="713">2rpm/5ms</text>

    <rect x="615" y="675" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="670" y="697" font-weight="bold">破静摩擦补偿</text>
    <text x="670" y="713">Iq 抬底 0.65A</text>

    <rect x="755" y="675" width="110" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="810" y="697" font-weight="bold">位置专用助推</text>
    <text x="810" y="713">3rad/s 独立通道</text>

    <rect x="895" y="675" width="130" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="960" y="697" font-weight="bold">速度指令 rpm</text>
    <text x="960" y="713">→ 速度环输入</text>
  </g>

  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <line x1="145" y1="700" x2="173" y2="700" marker-end="url(#arrowPurple)"/>
    <line x1="305" y1="700" x2="333" y2="700" marker-end="url(#arrowPurple)"/>
    <line x1="445" y1="700" x2="473" y2="700" marker-end="url(#arrowPurple)"/>
    <line x1="585" y1="700" x2="613" y2="700" marker-end="url(#arrowPurple)"/>
    <line x1="725" y1="700" x2="753" y2="700" marker-end="url(#arrowPurple)"/>
    <line x1="865" y1="700" x2="893" y2="700" marker-end="url(#arrowPurple)"/>
  </g>

  <!-- 位置反馈来自机械角 -->
  <path d="M 1190 345 L 1190 620 L 390 673" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- 速度指令到速度环 -->
  <path d="M 960 675 L 960 635 L 640 482" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrowPurple)"/>

  <!-- 切入重置标注 -->
  <rect x="35" y="740" width="450" height="35" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="260" y="762" font-size="11" text-anchor="middle" fill="#991b1b">位置反馈低通 + 切入重置：切入位置模式时对齐滤波器状态，防 ST-LINK 烧录后 static 残留导致猛冲</text>

  <!-- ========== 图例 ========== -->
  <rect x="20" y="810" width="1440" height="250" rx="10" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="35" y="838" font-size="15" font-weight="bold" fill="#111">图例与关键说明</text>

  <g font-size="12">
    <rect x="40" y="855" width="20" height="16" rx="3" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="868">FOC 变换 / 电流环模块</text>

    <rect x="250" y="855" width="20" height="16" rx="3" fill="#fff" stroke="#16a34a" stroke-width="2"/>
    <text x="280" y="868">角度获取模块</text>

    <rect x="430" y="855" width="20" height="16" rx="3" fill="#fff" stroke="#ea580c" stroke-width="2"/>
    <text x="460" y="868">速度环 / PLL 模块</text>

    <rect x="630" y="855" width="20" height="16" rx="3" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="660" y="868">位置环模块</text>

    <rect x="780" y="855" width="20" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="810" y="868">补偿机制模块</text>

    <rect x="950" y="855" width="20" height="16" rx="3" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
    <text x="980" y="868">核心输出（Theta / Iq指令）</text>
  </g>

  <g font-size="12">
    <line x1="40" y1="900" x2="70" y2="900" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="80" y="904">主数据流方向</text>

    <line x1="220" y1="900" x2="250" y2="900" stroke="#333" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="260" y="904">跨链路引用（角度/指令传递）</text>
  </g>

  <text x="40" y="935" font-size="13" font-weight="bold" fill="#111">三条核心链路：</text>
  <text x="40" y="958" font-size="12" fill="#333">① 电流链：ADC → Clarke → Park(用Theta) → 电流环PI → 死区补偿(用Theta) → 反Park(用Theta) → SVPWM → 电机（20kHz 每拍）</text>
  <text x="40" y="978" font-size="12" fill="#333">② 角度链：霍尔 → s_hall_ang(60°钳位) → Theta(减零位×方向) → 机械角(÷4) → 位置环反馈 + PLL输入（20kHz 每拍）</text>
  <text x="40" y="998" font-size="12" fill="#333">③ 速度链：机械角 → PLL(平滑转速) → 速度环PI → 摩擦前馈/抗饱和/抬底/斜率限幅 → Iq指令 → 电流环（1kHz 每20拍）</text>
  <text x="40" y="1025" font-size="12" fill="#991b1b" font-weight="bold">关键区分：FOC 电角度 Theta 直接来自霍尔估算（有60°扇区钳位兜底），不经过 PLL；PLL 只用来从机械角观测平滑转速。</text>
  <text x="40" y="1048" font-size="12" fill="#166534">18 项补偿分布：电流环4项（死区/滤波/整定/限幅）+ 速度环9项（摩擦前馈/角度助推/丢边沿/抬底/PLL/钳位/禁反向/抗饱和/斜率）+ 位置环5项（破摩擦/单圈角/切入重置/斜率/专用助推）</text>
</svg>
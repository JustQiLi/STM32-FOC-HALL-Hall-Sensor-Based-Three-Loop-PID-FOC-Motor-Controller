<text x="30" y="695" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#233247" text-anchor="start" dominant-baseline="central">位置模式：位置 → 速度 → 电流；速度模式：速度 → 电流；转矩模式：直接给电流目标。</text>

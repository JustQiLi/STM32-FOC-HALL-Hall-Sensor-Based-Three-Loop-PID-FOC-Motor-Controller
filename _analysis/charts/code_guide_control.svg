<text x="365.0" y="187.0" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#233247" text-anchor="middle" dominant-baseline="central">速度 PI · 1 kHz</text>
<text x="365.0" y="215.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#233247" text-anchor="middle" dominant-baseline="central">速度误差 rpm</text>

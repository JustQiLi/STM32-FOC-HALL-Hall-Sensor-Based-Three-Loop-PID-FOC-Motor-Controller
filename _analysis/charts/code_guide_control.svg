<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img">
<rect width="1200" height="100%" fill="white"/>
<text x="30" y="35" font-family="Microsoft YaHei, sans-serif" font-size="27" fill="#233247" text-anchor="start" dominant-baseline="central">控制与补偿：外环给目标，内环执行，传感器闭合反馈</text>
<text x="30" y="78" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#68778a" text-anchor="start" dominant-baseline="central">功能数据流图；实际中断先执行电流环，再更新观测器与外环目标（见正文）。</text>
